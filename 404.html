<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#12151a">
    <title>Seite nicht gefunden · AD Wegweiser</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #12151a; color: #e7eaf0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(520px, 100%); padding: 28px; border: 1px solid #2b3341; border-radius: 10px; background: #191d25; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 6px; background: #64dd17; color: #0c0e12; font-weight: 900; }
      h1 { margin: 18px 0 4px; font-size: clamp(1.7rem, 7vw, 2.35rem); letter-spacing: -.025em; }
      h2 { margin: 0 0 18px; color: #9ba6b8; font-size: 1rem; }
      p { margin: 0 0 22px; max-width: 40ch; color: #9ba6b8; line-height: 1.55; }
      a { display: inline-grid; min-height: 44px; padding: 10px 15px; place-items: center; border: 1px solid #64dd17; border-radius: 6px; background: #212733; color: #e7eaf0; font-weight: 800; text-decoration: none; }
      a:hover { background: #2b3341; }
      a:focus-visible { outline: 3px solid #64dd17; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">AD</span>
      <h1>Seite nicht gefunden</h1>
      <h2>Hier gibt es keinen Guide-Abschnitt.</h2>
      <p>Dieser Link führt zu keinem EC. Dein Spielstand bleibt davon unberührt, denn er wird nur lokal im Browser gelesen.</p>
      <a href="./">Wegweiser öffnen</a>
    </main>
  </body>
</html>
